# Main configuration for the image: unprivileged worker, logs to the container
# stdout/stderr, every scratch path under /tmp so the root filesystem can be
# read-only. The site itself is configured in conf.d/moat-atlas.conf.

worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr  warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    types {
        application/manifest+json  webmanifest;
    }

    # The canonical HTML page a Markdown twin mirrors: /moats/7.md and
    # /moats/7/index.md both point back at /moats/7/. Kept as a path, not an
    # absolute URL — a relative reference in a Link header is resolved against
    # the request, so nothing here has to know the scheme or the host.
    map $uri $md_canonical {
        default                  "/";
        "~^(?<page>.*)/index\.md$"  "$page/";
        "~^(?<page>.*)\.md$"        "$page/";
    }

    # The peer is the ingress (Traefik pod), never the visitor; Cloudflare puts
    # the visitor in CF-Connecting-IP. Only trust it from private/pod and
    # loopback peers, so $remote_addr in the log is the visitor behind the
    # cluster and stays the real peer for a container run on its own.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    set_real_ip_from  127.0.0.1;
    set_real_ip_from  fc00::/7;
    set_real_ip_from  ::1;
    real_ip_header    CF-Connecting-IP;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;

    charset            utf-8;
    sendfile           on;
    tcp_nopush         on;
    server_tokens      off;
    keepalive_timeout  65;

    # Nothing outside /tmp is writable for the nginx user.
    client_body_temp_path  /tmp/client_body;
    proxy_temp_path        /tmp/proxy;
    fastcgi_temp_path      /tmp/fastcgi;
    uwsgi_temp_path        /tmp/uwsgi;
    scgi_temp_path         /tmp/scgi;

    # The build ships .gz twins; gzip on is the fallback for what it skipped.
    gzip_static        on;
    gzip               on;
    gzip_vary          on;
    gzip_comp_level    6;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_types         text/plain text/css text/xml text/markdown
                       application/javascript application/json
                       application/manifest+json application/xml
                       image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
