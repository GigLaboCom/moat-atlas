server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    autoindex   off;
    error_page  404  /404.html;

    # llmstxt.org appends `index.md` to a URL with no filename, so the twin of
    # the home page is /index.md; `/.md` is the form a crawler guesses instead.
    # Astro cannot emit a file whose whole name is an extension, so it lands here.
    rewrite  ^(.*)/\.md$  $1/index.md  last;

    location = /healthz {
        access_log  off;
        default_type  text/plain;
        return  200  "ok\n";
    }

    # Hashed bundles: the name changes whenever the bytes do.
    location /_astro/ {
        include     /etc/nginx/snippets/headers.conf;
        add_header  Cache-Control  "public, max-age=31536000, immutable"  always;
        try_files   $uri =404;
    }

    # Icons, cards and fonts keep their names across builds — revalidate weekly.
    location ~* \.(?:png|jpe?g|gif|webp|avif|ico|svg|woff2?|ttf|otf|mp4|webm)$ {
        include     /etc/nginx/snippets/headers.conf;
        add_header  Cache-Control  "public, max-age=604800"  always;
        try_files   $uri =404;
    }

    # Markdown page twins — the agent-readable copy of every page. The decisions
    # behind these headers are documented in src/lib/seo/md-twin.ts; the short
    # version: the accurate content type, inline so a browser shows it, a
    # canonical back to the HTML page so the two never compete, and CORS because
    # browser-resident agents fetch cross-origin.
    location ~ \.md$ {
        include        /etc/nginx/snippets/headers.conf;
        types          { text/markdown  md; }
        default_type   text/markdown;
        charset        utf-8;
        charset_types  text/markdown;
        add_header  Content-Disposition          "inline"                             always;
        add_header  Access-Control-Allow-Origin  "*"                                  always;
        add_header  Link                         "<$md_canonical>; rel=\"canonical\""  always;
        add_header  Cache-Control  "public, max-age=3600, stale-while-revalidate=86400"  always;
        # A missing twin answers in kind: one plain line, never the HTML 404
        # page — that is prose an agent would ingest and quote back.
        error_page  404  =  @md_not_found;
        try_files   $uri =404;
    }

    location @md_not_found {
        include       /etc/nginx/snippets/headers.conf;
        default_type  text/plain;
        return        404  "Not found\n";
    }

    # The rest of the machine-readable layer. No noindex on any of it: an agent
    # that honours noindex would refuse to use the file it just fetched.
    location ~ ^/(?:llms\.txt|robots\.txt|sitemap\.xml)$ {
        include     /etc/nginx/snippets/headers.conf;
        add_header  Access-Control-Allow-Origin  "*"  always;
        add_header  Cache-Control  "public, max-age=3600, stale-while-revalidate=86400"  always;
        try_files   $uri =404;
    }

    # Everything else is HTML or a manifest: cheap to fetch, must stay current.
    # The build is directory-style, so /moats/7/ and /moats/7 both land on the
    # same index.html; the canonical link tag settles which one search sees.
    location / {
        include     /etc/nginx/snippets/headers.conf;
        add_header  Cache-Control  "no-cache"  always;
        try_files   $uri $uri/index.html $uri/ =404;
    }
}
