<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Moat Atlas</title>
  <!-- Master icon: four cores of different depth against the earth, cut by the
       ground line. Geometry is on a 16px grid so every derived size stays crisp.
       Colours are the rock palette from src/data/moats.ts. -->
  <rect width="512" height="512" fill="#14100c"/>
  <rect x="48" y="80" width="416" height="16" fill="#a8987f"/>
  <rect x="80"  y="96" width="64" height="144" fill="#2fbfa5"/>
  <rect x="176" y="96" width="64" height="288" fill="#d6a644"/>
  <rect x="272" y="96" width="64" height="208" fill="#9b76d9"/>
  <rect x="368" y="96" width="64" height="336" fill="#c0453a"/>
</svg>
