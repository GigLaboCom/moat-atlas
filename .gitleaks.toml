# Gitleaks configuration
# https://github.com/gitleaks/gitleaks

title = "Moat Atlas gitleaks config"

[extend]
# Use the default gitleaks rules as a base
useDefault = true

[allowlist]
  description = "Allow generated artefacts and documented placeholders"

  paths = [
    '''node_modules/''',
    '''dist/''',
    # Generated by `npm run icons` / `npm run og` — binaries, not source.
    '''public/(og|icons)/''',
    '''package-lock\.json''',
  ]

  regexTarget = "match"
  regexes = [
    # The public GA4 measurement id shape used in .env.example and the docs.
    # It is a public identifier, shipped in the page, never a secret.
    '''G-XXXXXXXXXX''',
  ]
